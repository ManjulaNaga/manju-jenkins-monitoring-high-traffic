<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="15">
  <title>Jenkins is busy</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background:#f5f6f8; color:#222;
           display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:16px; }
    .card { background:#fff; border-radius:12px; padding:32px; max-width:440px; text-align:center;
            box-shadow:0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size:1.4rem; margin:0 0 12px; }
    p { color:#555; line-height:1.5; margin:0; }
    @media (prefers-color-scheme: dark) {
      body { background:#16181c; color:#eee; } .card { background:#22252b; } p { color:#aaa; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Jenkins is starting up or busy</h1>
    <p>We're getting things ready. This page refreshes automatically every 15 seconds.</p>
  </div>
</body>
</html>
